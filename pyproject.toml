[project]
name = "game-perf-toolkit"
version = "1.0.0"
description = "Game Perf Toolkit — 游戏性能测试工具集"
requires-python = ">=3.12"
dependencies = [
  "PyQt6>=6.5.0",
  "pydantic>=2.0.0",
  "pluggy>=1.3.0",
  "lxml>=4.9.0",
  "pandas>=2.0.0",
  "openpyxl>=3.1.0",
  "pyqtgraph>=0.13.0",
  "numpy>=1.24.0",
  "litellm>=1.80.0",
  "pydantic-ai>=0.1.0",
  "pydantic-ai-litellm>=0.2.0",
  "Jinja2>=3.1.0",
  "perfetto>=0.16.0",
  "loguru>=0.7.0",
  "platformdirs>=4.0.0",
  "velopack>=1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.24.0",
  "pyinstaller>=6.0.0",
]
agent = [
  "zhipuai>=2.1.5",
  "anthropic>=0.40.0",
  "pyyaml>=6.0",
  "mcp>=1.26.0",
]

[project.scripts]
toolkit = "toolkit.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
markers = ["asyncio: mark a test as an async test"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.setuptools.packages.find]
include = ["toolkit*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
