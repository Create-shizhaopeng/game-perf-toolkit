[project]
name = "lv-game-toolkit"
version = "1.0.0"
description = "LV Game Toolkit — 游戏开发测试工具集"
requires-python = ">=3.12"
dependencies = [
  "PyQt6>=6.5.0",
  "typer[all]>=0.9.0",
  "rich>=13.0.0",
  "pydantic>=2.0.0",
  "pluggy>=1.3.0",
  "lxml>=4.9.0",
  "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pyinstaller>=6.0.0",
]

[project.scripts]
toolkit = "toolkit.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.setuptools.packages.find]
include = ["toolkit*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
