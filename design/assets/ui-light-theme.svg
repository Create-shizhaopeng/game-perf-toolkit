<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" width="720" height="580"
     preserveAspectRatio="xMidYMid meet">
  <!-- Design: min-width=640, min-height=520 -->
  <defs>
    <style>
      text { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; }
    </style>
    <linearGradient id="btnStartLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0e7ad3"/>
      <stop offset="100%" style="stop-color:#0062a3"/>
    </linearGradient>
    <linearGradient id="btnResetLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c94a4a"/>
      <stop offset="100%" style="stop-color:#a63d3d"/>
    </linearGradient>
  </defs>

  <!-- Window Frame -->
  <rect width="720" height="580" rx="8" fill="#f3f3f3"/>

  <!-- Title Bar (h=36) -->
  <rect width="720" height="36" rx="8" fill="#dddddd"/>
  <rect y="28" width="720" height="8" fill="#dddddd"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="18" r="6" fill="#febc2e"/>
  <circle cx="60" cy="18" r="6" fill="#28c840"/>
  <text x="360" y="18" text-anchor="middle" dominant-baseline="central" fill="#333333" font-size="13" font-weight="600">ModifyModelNameTool</text>
  <!-- Settings gear button -->
  <rect x="676" y="8" width="28" height="20" rx="3" fill="#e8e8e8" stroke="#cccccc" stroke-width="0.5"/>
  <g transform="translate(690, 18)">
    <circle cx="0" cy="0" r="5.5" fill="none" stroke="#555555" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="2" fill="#555555"/>
    <line x1="0" y1="-7.5" x2="0" y2="-4.5" stroke="#555555" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="4.5" x2="0" y2="7.5" stroke="#555555" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-7.5" y1="0" x2="-4.5" y2="0" stroke="#555555" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="4.5" y1="0" x2="7.5" y2="0" stroke="#555555" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-5.3" y1="-5.3" x2="-3.2" y2="-3.2" stroke="#555555" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="3.2" y1="3.2" x2="5.3" y2="5.3" stroke="#555555" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="5.3" y1="-5.3" x2="3.2" y2="-3.2" stroke="#555555" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-3.2" y1="3.2" x2="-5.3" y2="5.3" stroke="#555555" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Section 1: Current Device Info (y=48, h=90) - disguised state -->
  <rect x="16" y="48" width="688" height="90" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="32" y="68" fill="#0066b8" font-size="12" font-weight="600">&#x5F53;&#x524D;&#x8BBE;&#x5907;&#x4FE1;&#x606F;</text>
  <!-- Status badge (h=22, center=67) -->
  <rect x="590" y="56" width="98" height="22" rx="11" fill="#fff3cd" stroke="#ffc107" stroke-width="0.8"/>
  <text x="639" y="67" text-anchor="middle" dominant-baseline="central" fill="#856404" font-size="11">&#x25CF; &#x5DF2;&#x4F2A;&#x88C5;</text>

  <!-- Display fields (h=26, center=97) -->
  <text x="32" y="97" dominant-baseline="central" fill="#888888" font-size="12">brand:</text>
  <rect x="80" y="84" width="140" height="26" rx="3" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="0.8"/>
  <text x="92" y="97" dominant-baseline="central" fill="#333333" font-size="13">vivo</text>

  <text x="240" y="97" dominant-baseline="central" fill="#888888" font-size="12">manufacturer:</text>
  <rect x="328" y="84" width="140" height="26" rx="3" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="0.8"/>
  <text x="340" y="97" dominant-baseline="central" fill="#333333" font-size="13">vivo</text>

  <text x="488" y="97" dominant-baseline="central" fill="#888888" font-size="12">model:</text>
  <rect x="536" y="84" width="152" height="26" rx="3" fill="#f8f8f8" stroke="#e0e0e0" stroke-width="0.8"/>
  <text x="548" y="97" dominant-baseline="central" fill="#333333" font-size="13">V2505A</text>

  <!-- Connection indicator -->
  <rect x="32" y="118" width="8" height="8" rx="4" fill="#28a745"/>
  <text x="46" y="122" dominant-baseline="central" fill="#28a745" font-size="10">&#x8BBE;&#x5907;&#x5DF2;&#x8FDE;&#x63A5; &#xB7; USB</text>

  <!-- Section 2: Fake Device Info (y=150, h=80) -->
  <rect x="16" y="150" width="688" height="80" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="32" y="172" fill="#c05020" font-size="12" font-weight="600">&#x4F2A;&#x88C5;&#x8BBE;&#x5907;&#x4FE1;&#x606F;</text>

  <!-- Quick select button (20x20, same line as title) -->
  <rect x="108" y="158" width="20" height="20" rx="4" fill="#0e639c" stroke="#1177bb" stroke-width="0.8"/>
  <text x="118" y="168" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="12">&#x2606;</text>

  <!-- Input fields (h=28, center=210) -->
  <text x="32" y="210" dominant-baseline="central" fill="#888888" font-size="12">brand:</text>
  <rect x="80" y="196" width="140" height="28" rx="3" fill="#ffffff" stroke="#0078d4" stroke-width="1.5"/>
  <text x="92" y="210" dominant-baseline="central" fill="#333333" font-size="13">Xiaomi</text>
  <polygon points="206,207 212,207 209,213" fill="#888888"/>

  <text x="240" y="210" dominant-baseline="central" fill="#888888" font-size="12">manufacturer:</text>
  <rect x="328" y="196" width="140" height="28" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="340" y="210" dominant-baseline="central" fill="#333333" font-size="13">Xiaomi</text>
  <polygon points="454,207 460,207 457,213" fill="#888888"/>

  <text x="488" y="210" dominant-baseline="central" fill="#888888" font-size="12">model:</text>
  <rect x="536" y="196" width="152" height="28" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="548" y="210" dominant-baseline="central" fill="#333333" font-size="13">24090PN55C</text>
  <polygon points="674,207 680,207 677,213" fill="#888888"/>

  <!-- Section 3: Progress Area (completed state, y=242, h=240) -->
  <rect x="16" y="242" width="688" height="240" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="32" y="264" fill="#0066b8" font-size="12" font-weight="600">&#x6267;&#x884C;&#x65E5;&#x5FD7;</text>

  <text x="32" y="294" fill="#22863a" font-size="12">&#x2713; adb root &#x6210;&#x529F;</text>
  <text x="32" y="316" fill="#22863a" font-size="12">&#x2713; adb remount &#x6210;&#x529F;</text>
  <text x="32" y="338" fill="#22863a" font-size="12">&#x2713; setenforce 0 &#x5B8C;&#x6210;</text>
  <text x="32" y="360" fill="#22863a" font-size="12">&#x2713; build.prop &#x5DF2;&#x4FEE;&#x6539;</text>
  <text x="32" y="382" fill="#22863a" font-size="12">&#x2713; &#x8BBE;&#x5907;&#x5DF2;&#x91CD;&#x542F;</text>
  <text x="32" y="404" fill="#22863a" font-size="12">&#x2713; &#x8BBE;&#x5907;&#x5DF2;&#x8FDE;&#x63A5;</text>
  <text x="32" y="426" fill="#0066b8" font-size="12" font-weight="600">&#x2713; &#x8BBE;&#x5907;&#x4FE1;&#x606F;&#x4F2A;&#x88C5;&#x6210;&#x529F;: brand=Xiaomi, model=24090PN55C</text>

  <rect x="32" y="456" width="660" height="1" fill="#e0e0e0"/>

  <rect x="32" y="464" width="656" height="4" rx="2" fill="#e0e0e0"/>
  <rect x="32" y="464" width="656" height="4" rx="2" fill="#28a745"/>
  <text x="32" y="476" fill="#888888" font-size="10">&#x8FDB;&#x5EA6;: 100% &#x5B8C;&#x6210;</text>

  <!-- Section 4: Action Buttons (y=494, h=70) -->
  <rect x="16" y="494" width="688" height="70" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Start Button (140x36) -->
  <rect x="80" y="512" width="140" height="36" rx="4" fill="url(#btnStartLight)"/>
  <text x="150" y="530" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="14" font-weight="600">&#x25B6; Start</text>

  <!-- Clear Button (140x36) -->
  <rect x="280" y="512" width="140" height="36" rx="4" fill="#e8e8e8" stroke="#cccccc" stroke-width="1"/>
  <text x="350" y="530" text-anchor="middle" dominant-baseline="central" fill="#555555" font-size="14" font-weight="600">&#x2715; Clear</text>

  <!-- Reset Button (140x36) -->
  <rect x="480" y="512" width="140" height="36" rx="4" fill="url(#btnResetLight)"/>
  <text x="550" y="530" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="14" font-weight="600">&#x21BA; Reset</text>
</svg>
