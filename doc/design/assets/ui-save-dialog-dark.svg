<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 380" width="480" height="380"
     preserveAspectRatio="xMidYMid meet">
  <!-- Design: min-width=400, min-height=320 -->
  <defs>
    <style>
      text { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; }
    </style>
    <filter id="dialogShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="saveBtn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0e7ad3"/>
      <stop offset="100%" style="stop-color:#0062a3"/>
    </linearGradient>
  </defs>

  <!-- Dimmed background -->
  <rect width="480" height="380" fill="#0a0a0a" opacity="0.7"/>

  <!-- Dialog frame -->
  <rect x="50" y="20" width="380" height="340" rx="8" fill="#252526" stroke="#3c3c3c" stroke-width="1" filter="url(#dialogShadow)"/>

  <!-- Dialog Title Bar (h=40, center=40) -->
  <rect x="50" y="20" width="380" height="40" rx="8" fill="#2d2d30"/>
  <rect x="50" y="52" width="380" height="8" fill="#2d2d30"/>
  <text x="240" y="40" text-anchor="middle" dominant-baseline="central" fill="#cccccc" font-size="14" font-weight="600">&#x4FDD;&#x5B58;&#x8BBE;&#x5907;&#x4FE1;&#x606F;</text>
  <!-- Close button -->
  <text x="412" y="40" dominant-baseline="central" fill="#858585" font-size="16" text-anchor="middle">&#xD7;</text>

  <!-- Brand row (rect h=28, center=92) -->
  <text x="155" y="92" text-anchor="end" dominant-baseline="central" fill="#cccccc" font-size="12">brand:</text>
  <rect x="165" y="78" width="230" height="28" rx="3" fill="#3c3c3c" stroke="#007acc" stroke-width="1"/>
  <text x="177" y="92" dominant-baseline="central" fill="#d4d4d4" font-size="13">vivo</text>

  <!-- Manufacturer row (rect h=28, center=140) -->
  <text x="155" y="140" text-anchor="end" dominant-baseline="central" fill="#cccccc" font-size="12">manufacturer:</text>
  <rect x="165" y="126" width="230" height="28" rx="3" fill="#3c3c3c" stroke="#3c3c3c" stroke-width="1"/>
  <text x="177" y="140" dominant-baseline="central" fill="#d4d4d4" font-size="13">vivo</text>

  <!-- Model row (rect h=28, center=188) -->
  <text x="155" y="188" text-anchor="end" dominant-baseline="central" fill="#cccccc" font-size="12">model:</text>
  <rect x="165" y="174" width="230" height="28" rx="3" fill="#3c3c3c" stroke="#3c3c3c" stroke-width="1"/>
  <text x="177" y="188" dominant-baseline="central" fill="#d4d4d4" font-size="13">V2505A</text>

  <!-- Notes row (multi-line, label aligns with first text line) -->
  <text x="155" y="240" text-anchor="end" fill="#cccccc" font-size="12">&#x5907;&#x6CE8;:</text>
  <rect x="165" y="218" width="230" height="68" rx="3" fill="#3c3c3c" stroke="#3c3c3c" stroke-width="1"/>
  <text x="177" y="240" fill="#5a5a5a" font-size="12" font-style="italic">&#x8BF7;&#x63CF;&#x8FF0;&#x6B64;&#x8BBE;&#x5907;&#x4FE1;&#x606F;</text>
  <text x="177" y="258" fill="#5a5a5a" font-size="12" font-style="italic">&#x5BF9;&#x5E94;&#x54EA;&#x4E9B;&#x9AD8;&#x5E27;&#x6E38;&#x620F;</text>

  <!-- Buttons (centered, 140x36, center=322) -->
  <rect x="92" y="304" width="140" height="36" rx="4" fill="url(#saveBtn)"/>
  <text x="162" y="322" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-size="14" font-weight="600">Save</text>

  <rect x="248" y="304" width="140" height="36" rx="4" fill="#3c3c3c" stroke="#505050" stroke-width="1"/>
  <text x="318" y="322" text-anchor="middle" dominant-baseline="central" fill="#cccccc" font-size="14" font-weight="600">Cancel</text>
</svg>
