id: memory
title: "内存分析"
order: 4

trigger:
  when_skills_used:
    - memory_growth_detector
    - memory_rss_high_watermark
    - gc_events_in_range
    - memory_pressure_in_range
    - linux_process_rss_swap_timeline
    - native_heap_breakdown

data_schema:
  core_metrics:
    type: object
    label: "内存核心指标"
    required: true
    fields:
      - { key: rss_max_mb, label: "RSS 峰值", format: memory_mb }
      - { key: rss_avg_mb, label: "RSS 平均值", format: memory_mb }
      - { key: rss_min_mb, label: "RSS 最小值", format: memory_mb }
      - { key: swap_used_mb, label: "Swap 使用", format: memory_mb, optional: true }
      - { key: gc_count, label: "GC 次数", format: integer, optional: true }
      - { key: gc_total_ms, label: "GC 总耗时", format: duration_ms, optional: true }
      - { key: rating, label: "内存评级", format: text }

  memory_trend:
    type: text
    label: "内存趋势判断"
    required: false
    fields:
      - { key: trend, label: "趋势", format: text }
      - { key: description, label: "描述", format: text }

  gc_events:
    type: table
    label: "GC 事件"
    required: false
    max_rows: 10
    columns:
      - { key: gc_name, label: "GC 类型" }
      - { key: count, label: "次数", format: integer }
      - { key: total_ms, label: "总耗时(ms)", format: decimal_1 }
      - { key: avg_ms, label: "平均(ms)", format: decimal_2 }
      - { key: max_ms, label: "最大(ms)", format: decimal_2 }
