id: sf_composition
title: "SurfaceFlinger 合成分析"
order: 6

trigger:
  when_skills_used:
    - sf_composition_in_range
    - sf_layer_count_in_range
    - sf_frame_consumption
    - consumer_jank_detection

data_schema:
  core_metrics:
    type: object
    label: "合成核心指标"
    required: true
    fields:
      - { key: composition_count, label: "合成次数", format: integer }
      - { key: avg_dur_us, label: "平均耗时", format: duration_us }
      - { key: p95_dur_us, label: "P95 耗时", format: duration_us }
      - { key: max_dur_us, label: "最大耗时", format: duration_us }
      - { key: missed_frame_count, label: "SF侧丢帧", format: integer, optional: true }

  sf_hotspots:
    type: table
    label: "合成热点"
    required: false
    max_rows: 10
    columns:
      - { key: slice_name, label: "操作" }
      - { key: count, label: "次数", format: integer }
      - { key: avg_us, label: "平均(us)", format: decimal_1 }
      - { key: p95_us, label: "P95(us)", format: decimal_1 }
      - { key: max_us, label: "最大(us)", format: decimal_1 }
