<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfetto 分析报告 — {{ trace_name }}</title>
<style>
  :root {
    --primary: #1a73e8;
    --success: #4caf50;
    --warning: #ff9800;
    --danger: #f44336;
    --info: #2196f3;
    --bg: #f8f9fa;
    --card-bg: #ffffff;
    --text: #333333;
    --text-secondary: #666666;
    --border: #e0e0e0;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    padding: 24px;
  }
  .container { max-width: 960px; margin: 0 auto; }

  /* Card */
  .card {
    background: var(--card-bg); border-radius: var(--radius);
    box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 28px; margin-bottom: 20px;
  }
  h2 { font-size: 18px; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid var(--primary); }
  h3 { font-size: 15px; margin: 16px 0 8px; color: var(--text-secondary); }
  h4 { font-size: 14px; margin: 12px 0 6px; }

  /* Metric Grid */
  .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .metric-card {
    background: var(--bg); padding: 14px; border-radius: 6px;
    text-align: center; border-left: 3px solid var(--border);
  }
  .metric-card .metric-label { font-size: 12px; color: var(--text-secondary); display: block; margin-bottom: 4px; }
  .metric-card .metric-value { font-size: 20px; font-weight: 600; }
  .severity-excellent { border-left-color: var(--success); }
  .severity-good { border-left-color: var(--info); }
  .severity-warning { border-left-color: var(--warning); }
  .severity-critical { border-left-color: var(--danger); }

  /* Data Table */
  .data-table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 13px; }
  .data-table th {
    text-align: left; padding: 8px 12px; background: var(--bg);
    border-bottom: 2px solid var(--border); font-weight: 600; color: var(--text-secondary);
  }
  .data-table td { padding: 6px 12px; border-bottom: 1px solid var(--border); }
  .data-table tr:hover { background: rgba(26,115,232,.04); }
  .section-note { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; font-style: italic; }

  /* Distribution Bar */
  .distribution-bar {
    display: flex; height: 28px; border-radius: 4px; overflow: hidden; margin: 12px 0;
    background: #eee;
  }
  .bar-segment {
    display: flex; align-items: center; justify-content: center;
    min-width: 0; font-size: 11px; color: #fff; transition: flex .3s;
  }
  .bar-segment:nth-child(1) { background: #4caf50; }
  .bar-segment:nth-child(2) { background: #8bc34a; }
  .bar-segment:nth-child(3) { background: #cddc39; }
  .bar-segment:nth-child(4) { background: #ffc107; }
  .bar-segment:nth-child(5) { background: #ff9800; }
  .bar-segment:nth-child(6) { background: #ff7043; }
  .bar-segment:nth-child(7) { background: #f44336; }
  .bar-segment:nth-child(8) { background: #d32f2f; }
  .bar-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-value { margin-left: 4px; opacity: .9; }

  /* Root Cause */
  .root-cause-card {
    border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin: 8px 0;
  }
  .root-cause-card.severity-critical { border-left: 4px solid var(--danger); }
  .root-cause-card.severity-high { border-left: 4px solid var(--warning); }
  .root-cause-card.severity-medium { border-left: 4px solid var(--info); }
  .root-cause-card.severity-low { border-left: 4px solid var(--success); }
  .root-cause-card.severity-info { border-left: 4px solid #9e9e9e; }
  .rc-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .rc-severity { font-size: 11px; padding: 2px 8px; border-radius: 12px; color: #fff; font-weight: 600; }
  .badge-critical { background: var(--danger); }
  .badge-high { background: var(--warning); }
  .badge-medium { background: var(--info); }
  .badge-low { background: var(--success); }
  .badge-info { background: #9e9e9e; }
  .rc-rank { font-size: 12px; color: var(--text-secondary); }
  .rc-cause { font-weight: 600; font-size: 14px; }
  .rc-evidence { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
  .rc-impact { font-size: 12px; color: var(--text-secondary); }
  .rc-suggestion { font-size: 12px; color: var(--primary); margin-top: 4px; }

  /* Conclusion */
  .conclusion-section { margin-top: 8px; }
  .overall-rating { text-align: center; margin-bottom: 16px; }
  .rating-badge {
    display: inline-block; font-size: 22px; font-weight: 700;
    padding: 8px 24px; border-radius: 20px; color: #fff;
  }
  .rating-green .rating-badge { background: var(--success); }
  .rating-yellow .rating-badge { background: var(--warning); }
  .rating-red .rating-badge { background: var(--danger); }
  .conclusion-summary { font-size: 14px; line-height: 1.8; padding: 12px; background: var(--bg); border-radius: 6px; }
  .highlight-list, .risk-list, .recommendation-list { margin: 12px 0; }
  .highlight-list ul, .risk-list ul, .recommendation-list ul { padding-left: 20px; }
  .highlight-item { color: var(--success); margin: 4px 0; }
  .risk-item { color: var(--danger); margin: 4px 0; }
  .recommendation-list li { color: var(--primary); margin: 4px 0; }

  /* Severity Badge */
  .severity-badge {
    display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 12px;
    color: #fff; font-weight: 600;
  }
  .severity-badge.severity-critical, .severity-badge.severity-critical { background: var(--danger); }
  .severity-badge.severity-high, .severity-badge.severity-high { background: var(--warning); }
  .severity-badge.severity-medium, .severity-badge.severity-medium { background: var(--info); }
  .severity-badge.severity-low, .severity-badge.severity-low { background: var(--success); }
  .severity-badge.severity-info, .severity-badge.severity-info { background: #9e9e9e; }

  /* Footer */
  .footer { text-align: center; padding: 16px; color: var(--text-secondary); font-size: 12px; }
</style>
</head>
<body>
<div class="container">
  {{ chapters | join('\n') }}
  {{ conclusion }}
  <div class="footer">
    由 LV Game Toolkit Perfetto AI 分析引擎生成 | {{ analysis_time }}
  </div>
</div>
</body>
</html>
